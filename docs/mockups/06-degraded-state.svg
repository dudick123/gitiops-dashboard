  <text x="232" y="674" fill="#94a3b8" font-size="10" font-weight="600">DEGRADED STATE BEHAVIORS DEMONSTRATED (DG-01):</text>
  <text x="232" y="692" fill="#cbd5e1" font-size="10">1. STAGE columns show "Unknown" with dashed border — last refresh timestamp visible</text>
  <text x="232" y="706" fill="#cbd5e1" font-size="10">2. DEV and PROD continue rendering normally — unaffected by STAGE outage</text>
  <text x="700" y="692" fill="#cbd5e1" font-size="10">3. Metrics module unaffected — Prometheus is independent of ArgoCD</text>
  <text x="700" y="706" fill="#cbd5e1" font-size="10">4. Network module unaffected — network-connectors query K8s API directly</text>


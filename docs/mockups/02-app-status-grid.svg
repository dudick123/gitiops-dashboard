<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; }
      .card { fill: #1e293b; }
      .card-header { fill: #94a3b8; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
      .title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 12px; }
      .nav-item { fill: #cbd5e1; font-size: 13px; }
      .nav-active { fill: #38bdf8; font-size: 13px; font-weight: 600; }
      .divider { stroke: #334155; stroke-width: 1; }
      .filter-bg { fill: #334155; }
      .filter-active { fill: #1d4ed8; }
      .filter-text { fill: #e2e8f0; font-size: 11px; font-weight: 500; }
      .col-header { fill: #94a3b8; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
      .app-name { fill: #e2e8f0; font-size: 12px; font-weight: 500; }
      .timestamp { fill: #64748b; font-size: 10px; }
      .row-bg-even { fill: #1e293b; }
      .row-bg-odd { fill: #172032; }
    </style>
  </defs>

  <rect width="1200" height="800" class="bg"/>

  <!-- Sidebar (condensed) -->

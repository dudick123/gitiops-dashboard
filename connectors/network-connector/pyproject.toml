[project]
name = "network-connector"
version = "0.1.0"
description = "Network connector for GitOps Dashboard — queries Kubernetes API for NetworkPolicy resources across AKS clusters"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "redis>=5.0",
    "uvicorn>=0.32.0",
    "kubernetes>=31.0.0",
    "orjson>=3.10.0",
    "prometheus-fastapi-instrumentator>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
strict = true
python_version = "3.14"
